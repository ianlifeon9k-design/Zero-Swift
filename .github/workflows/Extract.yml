
name: Extract ZERO ZIP

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZERO ZIP
        run: |
          ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Upload extracted project
        uses: actions/upload-artifact@v4
        with:
          name: ZERO-Extracted
          path: extracted/
