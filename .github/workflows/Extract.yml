name: Extract ZERO ZIP

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o "ZERO Swift.zip" -d extracted

      - uses: actions/upload-artifact@v4
        with:
          name: ZERO-Extracted
          path: extracted/
